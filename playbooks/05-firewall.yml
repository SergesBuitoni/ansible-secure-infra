---
- name: Firewall Configuration
  hosts: all
  become: yes

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Install UFW
      apt:
        name: ufw
        state: present

    - name: Allow SSH
      ufw:
        rule: allow
        port: "{{ ssh_port }}"

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

